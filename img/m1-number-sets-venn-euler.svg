<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama Venn–Euler a mulțimilor numerice</title>
  <desc id="desc">Mulțimile N, Z și Q sunt incluse una în alta în interiorul lui R. Regiunea din R aflată în exteriorul lui Q reprezintă numerele iraționale.</desc>
  <rect x="12" y="12" width="1176" height="736" rx="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>

  <rect x="70" y="72" width="1060" height="616" rx="42" fill="#e0f2fe" fill-opacity="0.72" stroke="#0f172a" stroke-width="5"/>
  <text x="1080" y="130" text-anchor="end" font-family="Georgia,Times New Roman,serif" font-size="58" font-style="italic" font-weight="700" fill="#0f172a">R</text>
  <text x="1080" y="166" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#334155">numere reale</text>

  <ellipse cx="610" cy="385" rx="380" ry="235" fill="#dcfce7" fill-opacity="0.88" stroke="#166534" stroke-width="5"/>
  <text x="895" y="237" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="55" font-style="italic" font-weight="700" fill="#14532d">Q</text>
  <text x="895" y="274" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#166534">raționale</text>

  <ellipse cx="590" cy="405" rx="245" ry="145" fill="#fef3c7" fill-opacity="0.94" stroke="#92400e" stroke-width="5"/>
  <text x="750" y="344" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="53" font-style="italic" font-weight="700" fill="#78350f">Z</text>
  <text x="750" y="377" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#92400e">întregi</text>

  <ellipse cx="555" cy="422" rx="120" ry="72" fill="#fce7f3" fill-opacity="0.98" stroke="#9d174d" stroke-width="5"/>
  <text x="555" y="432" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="50" font-style="italic" font-weight="700" fill="#831843">N</text>
  <text x="555" y="468" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#9d174d">naturale</text>

  <path d="M145 215 C205 180, 260 190, 315 240" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="145" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#0f172a">Iraționale</text>
  <text x="145" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">R \ Q</text>
  <text x="145" y="332" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#475569">ex.: √2, π, e</text>

  <text x="600" y="655" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">N este în Z, Z este în Q, Q este în R</text>
</svg>
