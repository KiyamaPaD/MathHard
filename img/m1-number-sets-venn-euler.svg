<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-label="Diagrama mulțimilor numerice">
  <rect x="0" y="0" width="1600" height="800" rx="24" fill="#efefef"/>

  <style>
    .serif { font-family: "DejaVu Serif", Georgia, serif; fill: #000; }
    .title { font-size: 84px; }
    .subtitle { font-size: 28px; }
    .set-big { font-size: 50px; }
    .set-med { font-size: 42px; }
    .set-small { font-size: 32px; }
    .num-big { font-size: 58px; }
    .num-med { font-size: 38px; }
    .num-small { font-size: 24px; }
    .eq-small { font-size: 30px; }
  </style>

  <!-- Left-hand side -->
  <text x="85" y="330" class="serif title">ℝ =</text>
  <text x="85" y="395" class="serif subtitle">(reale)</text>

  <!-- Rational side -->
  <ellipse cx="680" cy="360" rx="330" ry="260" fill="#90c5d7" stroke="#000" stroke-width="5"/>
  <ellipse cx="670" cy="380" rx="250" ry="185" fill="#b7e60d" stroke="#000" stroke-width="5"/>
  <ellipse cx="640" cy="380" rx="160" ry="115" fill="#e5ddb0" stroke="#000" stroke-width="5"/>

  <!-- Q -->
  <text x="660" y="145" class="serif set-big">ℚ</text>
  <text x="710" y="145" class="serif subtitle">(raționale)</text>

  <!-- Z -->
  <text x="795" y="365" class="serif set-big">ℤ</text>
  <text x="820" y="405" class="serif num-small">(întregi)</text>

  <!-- N -->
  <text x="610" y="395" class="serif set-big">ℕ</text>
  <text x="620" y="440" class="serif subtitle">(naturale)</text>

  <!-- Natural examples -->
  <text x="535" y="345" class="serif num-big">67</text>
  <text x="655" y="300" class="serif num-med">0</text>
  <text x="735" y="395" class="serif num-big">1</text>

  <!-- Integer but not natural examples -->
  <text x="620" y="220" class="serif num-small">-1000</text>
  <text x="435" y="410" class="serif num-small">-1</text>
  <text x="495" y="545" class="serif num-big">-120</text>
  <text x="725" y="560" class="serif num-big">-5</text>

  <!-- Rational but not integer examples -->
  <text x="885" y="360" class="serif num-big">½</text>
  <text x="520" y="655" class="serif num-big">1,(3)</text>
  <text x="710" y="650" class="serif num-big">0,2</text>
  <text x="380" y="430" class="serif num-small">0,2(3)</text>

  <!-- Relation inside rationals -->
  <text x="610" y="735" class="serif eq-small">ℕ ⊊ ℤ ⊊ ℚ</text>

  <!-- Union -->
  <text x="1025" y="390" class="serif title">∪</text>
  <text x="1045" y="405" class="serif subtitle">(reuniune)</text>

  <!-- Irrational side -->
  <ellipse cx="1340" cy="390" rx="190" ry="165" fill="#7a9ac4" stroke="#000" stroke-width="5"/>
  <text x="1260" y="335" class="serif set-med">ℝ \ ℚ</text>
  <text x="1310" y="375" class="serif subtitle">(iraționale)</text>
  <text x="1225" y="475" class="serif num-big">π</text>
  <text x="1320" y="535" class="serif num-big">√3</text>
  <text x="1450" y="485" class="serif num-big">e</text>
</svg>
